name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13.15"
  IMAGE_REF: ghcr.io/loke2802/botwa-starter:sha-${{ github.sha }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify dependency locks
        run: python scripts/lock_dependencies.py --check
      - name: Audit locked runtime dependencies
        run: python scripts/audit_dependencies.py
      - name: Ruff
        run: ruff check app tests scripts
      - name: Black
        run: black --check app tests scripts
      - name: mypy
        run: mypy app tests
      - name: Git whitespace check
        run: git diff --check
      - name: Validate CI contracts
        run: python scripts/validate_ci_contract.py
      - name: Scan committed source for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Run full test suite
        env:
          BOTWA_ENVIRONMENT: test
          BOTWA_USE_DATABASE: "false"
          BOTWA_TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: pytest

  postgresql:
    name: postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: botwa_test
          POSTGRES_USER: botwa
          POSTGRES_PASSWORD: botwa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botwa -d botwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOTWA_ENVIRONMENT: test
      BOTWA_USE_DATABASE: "true"
      BOTWA_DATABASE_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_TEST_DATABASE_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD012_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD013_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD014_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD015_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD016_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD017_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD018_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD019_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD020_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD021_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
      BOTWA_PRD022_POSTGRES_URL: postgresql+psycopg://botwa:botwa_test_password@127.0.0.1:5432/botwa_test?connect_timeout=5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify one Alembic head
        run: test "$(alembic heads | grep -c '(head)')" -eq 1 && alembic heads | grep '20260813_0022 (head)'
      - name: Upgrade a fresh database
        run: alembic upgrade head && alembic current | grep '20260813_0022 (head)'
      - name: Validate adjacent migration cycle
        run: alembic downgrade 20260813_0021 && alembic upgrade 20260813_0022 && alembic current | grep '20260813_0022 (head)'
      - name: Run all deterministic PostgreSQL integration tests
        run: python scripts/run_postgresql_tests.py

  container-security:
    name: container-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: botwa_container
          POSTGRES_USER: botwa
          POSTGRES_PASSWORD: botwa_container_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botwa -d botwa_container"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact commit image
        run: docker build --provenance=false --build-arg BOTWA_BUILD_SHA="${GITHUB_SHA}" --tag "${IMAGE_REF}" .
      - name: Verify OCI metadata and non-root user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE_REF}")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE_REF}")" = "${GITHUB_SHA}"
          docker run --rm "${IMAGE_REF}" python -c "import importlib.util; assert importlib.util.find_spec('pip') is None"
      - name: Upgrade smoke database
        env:
          BOTWA_DATABASE_URL: postgresql+psycopg://botwa:botwa_container_password@localhost:5432/botwa_container
        run: docker run --rm --add-host host.docker.internal:host-gateway --env BOTWA_ENVIRONMENT=test --env BOTWA_DATABASE_URL=postgresql+psycopg://botwa:botwa_container_password@host.docker.internal:5432/botwa_container "${IMAGE_REF}" alembic upgrade head
      - name: Smoke liveness readiness version and SIGTERM
        run: python scripts/container_smoke.py --image "${IMAGE_REF}" --build-sha "${GITHUB_SHA}" --database-url postgresql+psycopg://botwa:botwa_container_password@host.docker.internal:5432/botwa_container
      - name: Report HIGH and CRITICAL image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          hide-progress: true
          timeout: 10m
      - name: Block fixable HIGH and CRITICAL image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
          timeout: 10m
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: v0.70.0
          format: cyclonedx
          output: botwa-sbom.cdx.json
          scanners: vuln
          hide-progress: true
          timeout: 10m
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botwa-sbom-${{ github.sha }}
          path: botwa-sbom.cdx.json
          retention-days: 30
      - name: Save the validated master image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save --output botwa-image.tar "${IMAGE_REF}"
      - name: Upload the validated master image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botwa-image-${{ github.sha }}
          path: botwa-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    name: publish-ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, tests, postgresql, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: botwa-image-${{ github.sha }}
      - name: Load validated image
        run: docker load --input botwa-image.tar
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable SHA tag and capture digest
        run: |
          docker push "${IMAGE_REF}"
          docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | tee image-digest.txt
      - name: Upload publication identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botwa-image-digest-${{ github.sha }}
          path: image-digest.txt
          retention-days: 90
