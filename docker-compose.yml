services:
  api:
    build: .
    environment:
      BOTWA_APP_NAME: ${BOTWA_APP_NAME}
      BOTWA_ENVIRONMENT: ${BOTWA_ENVIRONMENT}
      BOTWA_LOG_LEVEL: ${BOTWA_LOG_LEVEL}
      BOTWA_API_VERSION: ${BOTWA_API_VERSION}
      BOTWA_DATABASE_URL: ${BOTWA_DATABASE_URL}
      BOTWA_WHATSAPP_ACCESS_TOKEN: ${BOTWA_WHATSAPP_ACCESS_TOKEN}
      BOTWA_WHATSAPP_PHONE_NUMBER_ID: ${BOTWA_WHATSAPP_PHONE_NUMBER_ID}
      BOTWA_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${BOTWA_WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      BOTWA_WHATSAPP_API_VERSION: ${BOTWA_WHATSAPP_API_VERSION}
      BOTWA_WHATSAPP_SECRET_ENCRYPTION_KEY: ${BOTWA_WHATSAPP_SECRET_ENCRYPTION_KEY:-}
      BOTWA_WHATSAPP_SECRET_PREVIOUS_ENCRYPTION_KEYS: ${BOTWA_WHATSAPP_SECRET_PREVIOUS_ENCRYPTION_KEYS:-}
      BOTWA_WHATSAPP_LIVE_CLIENT_MODE: ${BOTWA_WHATSAPP_LIVE_CLIENT_MODE:-disabled}
      BOTWA_WHATSAPP_WEBHOOK_MAX_BODY_BYTES: ${BOTWA_WHATSAPP_WEBHOOK_MAX_BODY_BYTES:-1048576}
      BOTWA_WHATSAPP_WEBHOOK_MAX_EVENTS: ${BOTWA_WHATSAPP_WEBHOOK_MAX_EVENTS:-100}
      BOTWA_WHATSAPP_OUTBOUND_MAX_TEXT_CHARS: ${BOTWA_WHATSAPP_OUTBOUND_MAX_TEXT_CHARS:-4096}
      BOTWA_WHATSAPP_OUTBOUND_MAX_ATTEMPTS: ${BOTWA_WHATSAPP_OUTBOUND_MAX_ATTEMPTS:-3}
      BOTWA_WHATSAPP_OUTBOUND_RETRY_BASE_SECONDS: ${BOTWA_WHATSAPP_OUTBOUND_RETRY_BASE_SECONDS:-1}
      BOTWA_WHATSAPP_OUTBOUND_RETRY_MAX_SECONDS: ${BOTWA_WHATSAPP_OUTBOUND_RETRY_MAX_SECONDS:-60}
      BOTWA_WHATSAPP_META_TIMEOUT_SECONDS: ${BOTWA_WHATSAPP_META_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: botwa
      POSTGRES_USER: botwa
      POSTGRES_PASSWORD: botwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botwa -d botwa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
