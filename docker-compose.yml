services:
  api:
    build: .
    environment:
      BOTWA_APP_NAME: BotWA Starter
      BOTWA_ENVIRONMENT: local
      BOTWA_LOG_LEVEL: INFO
      BOTWA_API_VERSION: v1
      BOTWA_DATABASE_URL: postgresql+psycopg://botwa:botwa@db:5432/botwa
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: botwa
      POSTGRES_USER: botwa
      POSTGRES_PASSWORD: botwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botwa -d botwa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
