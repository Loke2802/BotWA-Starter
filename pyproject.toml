[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botwa-starter"
version = "0.1.0"
description = "BotWA Starter core implementation"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "PyJWT>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "prometheus-client>=0.21.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pip-audit==2.10.1",
    "pip-tools==7.6.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "PyYAML>=6.0.2",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12.20250516",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
