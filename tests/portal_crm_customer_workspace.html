<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas ficha comercial completa</title><link rel="stylesheet" href="../app/portal/portal.css"><main style="padding:24px"><h1>Pruebas ficha comercial completa</h1><p>API ficticia. Sin envíos ni llamadas externas.</p><pre id="results">Ejecutando…</pre><div id="report"></div></main><dialog id="fixture" open></dialog>
<script src="../app/portal/opportunity-history.js"></script><script src="../app/portal/opportunities.js"></script><script src="../app/portal/customer-workspace.js?v=20261006-growth"></script><script src="../app/portal/commercial-report.js"></script><script>
(async()=>{
 const modal=document.querySelector('#fixture'),out=document.querySelector('#results'),reportRoot=document.querySelector('#report'),results=[];
 const stages=[{code:'new',name:'Nueva',kind:'open',position:0},{code:'need',name:'Necesidad',kind:'open',position:1},{code:'won',name:'Ganada',kind:'won',position:2}];
 const permissions=['contacts.read','crm.opportunities.read','crm.opportunities.read_content','crm.opportunities.write'];
 let calls=[],activities=[],ops=[{id:'op',contact_id:'contact',title:'Propuesta',stage_code:'new',stage_kind:'open',assigned_user_id:'owner',version:1,next_action:{description:'Llamar',due_at:'2026-10-08T15:00:00Z'}}],viewer=false,lostActivity=true,lostOpportunity=true,draws=0;
 const keys=new Map(),assert=(v,m)=>{if(!v)throw Error(m);};
 const wait=async f=>{for(let i=0;i<180;i++){if(f())return;await new Promise(r=>setTimeout(r,10));}throw Error('Tiempo agotado');};
 async function api(path,options={}){
  calls.push({path,...options});
  if(path==='/auth/me')return {user:{id:'owner'}};
  if(path.includes('/workspace?'))return {contact_id:'contact',timezone:'America/Lima',can_write:!viewer,can_read_conversations:true,opportunities:{items:viewer?ops.map(o=>({...o,title:'Oportunidad',next_action:o.next_action?{...o.next_action,description:'Contenido restringido'}:null})):ops,total:ops.length,page:1,has_next:false},stages,conversations:[{id:'conv',status:'open',created_at:'2026-10-05T15:00:00Z'}],conversation_total:1,conversation_page:1,conversations_has_next:false};
  if(path.includes('/action-history?'))return {items:[{description:viewer?'Contenido restringido':'Acción anterior',due_at:'2026-10-05T15:00:00Z',resolved_at:'2026-10-06T15:00:00Z',status:'completed',assigned_user_id:'owner'}],total:1,page:1,has_next:false};
  if(path.includes('/activities')){
   if(options.method==='POST'){
    const key=options.headers['Idempotency-Key'];if(keys.has(key))return keys.get(key);const data=JSON.parse(options.body),row={...data,id:'activity',actor_user_id:'owner'};activities.push(row);keys.set(key,row);if(lostActivity){lostActivity=false;throw Error('Respuesta perdida');}return row;
   }
   return {items:viewer?activities.map(a=>({...a,description:'Contenido restringido'})):activities,total:activities.length,page:1,has_next:false};
  }
  if(path.includes('/suggestions/'))return {...(path.includes('/opportunities/')?{opportunity_id:'op',expected_version:ops[0].version,current_need:ops[0].need,current_stage_code:ops[0].stage_code,current_action:ops[0].next_action?.description}:{}),available:true,explanation:'Revisa antes de guardar',need:'Servicio <img src=x>',stage_code:'need',next_action:'Confirmar necesidad',evidence:['Quiero ese servicio']};
  if(path.endsWith('/opportunities')&&options.method==='POST'){
   const key=options.headers['Idempotency-Key'];if(keys.has(key))return keys.get(key);const data=JSON.parse(options.body);assert(data.conversation_id===null&&data.contact_id==='contact','Creación sin conversación');const row={...data,id:'new-op',version:1};ops.push(row);keys.set(key,row);if(lostOpportunity){lostOpportunity=false;throw Error('Respuesta perdida');}return row;
  }
  if(path.includes('/opportunities/')){const item=ops[0];if(options.method==='PATCH'){const data=JSON.parse(options.body);assert(data.complete_previous_action&&data.version===1,'Completar con versión');ops[0]={...item,...data,version:2};return ops[0];}return item;}
  if(path.endsWith('/assignees'))return [{id:'owner',name:'Propietario'}];
  if(path.includes('/commercial-report?'))return {timezone:'America/Lima',can_read_amounts:!viewer,items:[{assigned_user_id:'owner',kind:'open',count:2,currency:viewer?null:'PEN',amount:viewer?null:'30.50'},{assigned_user_id:'owner',kind:'won',count:1,currency:viewer?null:'USD',amount:viewer?null:'7.25'}]};
  throw Error('Ruta inesperada '+path);
 }
 const context={org:'company',api,assignees:[{id:'owner',name:'Propietario'}]};
 const refresh=async()=>{reportRoot.innerHTML=await LuriCommercialReport.render('company',api,{},permissions,refresh);LuriCommercialReport.mount(reportRoot);draws++;};
 const test=async(name,fn)=>{await fn();results.push('PASS '+name);out.textContent=results.join('\n');};
 try{
  await test('Ficha reúne ventas, próximas acciones y conversaciones',async()=>{await LuriCustomerWorkspace.attach(modal,context,'contact',()=>true);assert(modal.textContent.includes('Oportunidades y próximas acciones')&&modal.querySelector('[data-customer="conversation"]'),'Ficha reunida');});
  await test('Actividad con respuesta perdida reintenta sin duplicarse',async()=>{let f=modal.querySelector('#customer-activity');f.elements.description.value='Llamada privada';f.elements.occurred_at.value='2026-10-05T12:00';f.requestSubmit();await wait(()=>modal.textContent.includes('Respuesta perdida'));f.requestSubmit();await wait(()=>modal.textContent.includes('Actividad guardada'));const posts=calls.filter(c=>c.method==='POST'&&c.path.endsWith('/activities'));assert(activities.length===1&&posts.length===2&&posts[0].headers['Idempotency-Key']===posts[1].headers['Idempotency-Key'],'Deduplicación actividad');});
  await test('Completar acción y programar siguiente conserva versión',async()=>{modal.querySelector('[data-commercial="edit"]').click();await wait(()=>modal.querySelector('#commercial-form'));const f=modal.querySelector('#commercial-form');f.elements.complete_previous_action.checked=true;f.elements.description.value='Enviar propuesta';f.requestSubmit();await wait(()=>ops[0].version===2);await wait(()=>!modal.querySelector('#commercial-form'));});
  await test('Sugerencia se revisa y aplica sin guardar automáticamente',async()=>{modal.querySelector('[data-customer="suggest"]').click();await wait(()=>modal.querySelector('[data-customer="accept"]'));const before=ops.length;modal.querySelector('[data-customer="accept"]').click();assert(ops.length===before&&!modal.querySelector('img'),'Sin venta automática ni HTML');const f=modal.querySelector('#commercial-form');assert(f.elements.need.value==='Servicio <img src=x>'&&f.elements.due_at.required&&!f.elements.due_at.value&&!f.elements.assigned_user_id.value,'Requiere responsable/fecha humanos');});
  await test('Creación desde cliente reintenta con importe sin duplicarse',async()=>{const f=modal.querySelector('#commercial-form');f.elements.assigned_user_id.value='owner';f.elements.due_at.value='2026-10-08T10:00';f.elements.amount.value='40.00';f.elements.currency.value='PEN';f.requestSubmit();await wait(()=>modal.textContent.includes('Respuesta perdida'));f.requestSubmit();await wait(()=>modal.textContent.includes('Oportunidad guardada'));const posts=calls.filter(c=>c.method==='POST'&&c.path.endsWith('/opportunities'));assert(ops.length===2&&posts[0].headers['Idempotency-Key']===posts[1].headers['Idempotency-Key']&&JSON.parse(posts[1].body).amount==='40.00','Reintento conserva venta e importe');});
  await test('IA propone actualizar oportunidad sin escribir y conserva campos',async()=>{
    modal.querySelector('#customer-ai-target').value='op';modal.querySelector('[data-customer="suggest"]').click();await wait(()=>modal.textContent.includes('Revisión de oportunidad'));
    const before=calls.filter(c=>c.method==='PATCH').length;modal.querySelector('[data-customer="accept"]').click();await wait(()=>modal.querySelector('#commercial-form'));
    const f=modal.querySelector('#commercial-form');assert(f.elements.assigned_user_id.value==='owner'&&f.elements.need.value==='Servicio <img src=x>'&&ops[0].version===2,'Preserva responsable y versión');assert(calls.filter(c=>c.method==='PATCH').length===before,'Sin guardado automático');
  });
  await test('IA rechaza oportunidad cambiada después de sugerir',async()=>{
    modal.querySelector('[data-commercial="cancel"]').click();ops[0].version++;
    modal.querySelector('[data-customer="accept"]').click();await wait(()=>modal.textContent.includes('La oportunidad cambió'));assert(!modal.querySelector('#commercial-form'),'No aplica borrador obsoleto');
  });
  await test('Viewer recibe notas restringidas y no puede escribir',async()=>{viewer=true;modal.innerHTML='';await LuriCustomerWorkspace.attach(modal,context,'contact',()=>true);assert(!modal.querySelector('#customer-activity')&&!modal.querySelector('[data-commercial="edit"]')&&!modal.querySelector('[data-customer="suggest"]'),'Sin escritura');assert(!modal.textContent.includes('Llamada privada')&&!modal.textContent.includes('Acción anterior'),'Contenido restringido');viewer=false;});
  await test('Resumen separa monedas y filtra periodo inclusivo',async()=>{await refresh();assert(reportRoot.textContent.includes('PEN')&&reportRoot.textContent.includes('USD'),'Monedas separadas');const f=reportRoot.querySelector('form');f.elements.from.value='2026-10-01';f.elements.to.value='2026-10-06';const n=draws;f.requestSubmit();await wait(()=>draws>n);assert(calls.some(c=>c.path.includes('date_from=')&&c.path.includes('date_to=')),'Periodo llega al servidor');});
  await test('Resumen no consulta sin permiso y no muestra importes al viewer',async()=>{viewer=true;await refresh();assert(!reportRoot.textContent.includes('30.50')&&reportRoot.textContent.includes('Restringido'),'Sin importes');calls=[];assert((await LuriCommercialReport.render('company',api,{},[],refresh)).includes('No tienes permiso')&&calls.length===0,'No consultar');});
  await test('Ficha cerrada descarta resultados antiguos',async()=>{const host=document.createElement('dialog');document.body.append(host);let finish;const delayed=new Promise(r=>finish=r);const pending=LuriCustomerWorkspace.attach(host,{...context,api:async path=>{await delayed;return api(path);}},'contact',()=>false);host.remove();finish();await pending;assert(!host.textContent.includes('Propuesta'),'No repuebla ficha');});
  out.textContent+='\n11 pruebas aprobadas.';
 }catch(error){out.textContent+='\nFAIL '+error.message;throw error;}
})();</script></html>
