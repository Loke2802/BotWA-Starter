<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas calidad y métricas CRM</title><link rel="stylesheet" href="../app/portal/portal.css"><main style="padding:24px"><h1>Pruebas calidad y métricas CRM</h1><p>Datos y API simulados.</p><pre id="results">Ejecutando…</pre><div id="fixture"></div></main><script src="../app/portal/customer-quality.js"></script><script src="../app/portal/sales-metrics.js"></script><script>
(async()=>{
 const root=document.querySelector('#fixture'),out=document.querySelector('#results'),results=[],permissions=['contacts.read','contacts.read_sensitive','contacts.update','contacts.archive','crm.opportunities.read','crm.opportunities.write','crm.opportunities.read_content'];
 let calls=[],merged=false,lost=true,merges=0,draws=0,viewer=false,delayed;
 const assert=(v,m)=>{if(!v)throw Error(m);},wait=async f=>{for(let i=0;i<180;i++){if(f())return;await new Promise(r=>setTimeout(r,10));}throw Error('Tiempo agotado');};
 async function api(path,options={}){
  calls.push({path,...options});
  if(path.includes('/duplicates?')){if(delayed){const d=delayed;delayed=null;await d;}return {items:merged?[]:[{source_id:'source',target_id:'principal',source_name:'Cliente <img src=x>',target_name:'Principal',reasons:['correo']}],page:1,has_next:false,scanned:2,scan_limited:false};}
  if(path.includes('/merge-preview?'))return {source:{id:'source',name:'Cliente <img src=x>',channel:'email',identifier:'same@example.test',notes:'Nota que se conserva',profile:{classification:'lead'},opportunities:1,conversations:1,activities:1},target:{id:'principal',name:'Principal',channel:'whatsapp',identifier:'+12025550001',notes:'Nota principal',profile:{classification:'customer'},opportunities:2,conversations:0,activities:0},token:'a'.repeat(64),explanation:'Se conservan identidades e historial.'};
  if(path.endsWith('/customer-merges')){const data=JSON.parse(options.body);assert(data.source_id==='source'&&data.target_id==='principal'&&data.review_token==='a'.repeat(64),'Unión revisada');if(!merged){merges++;merged=true;}if(lost){lost=false;throw Error('Respuesta perdida');}return {source_id:'source',target_id:'principal',replayed:true};}
  if(path.includes('/sales-metrics?'))return {timezone:'America/Lima',as_of:'2026-10-06T15:00:00Z',can_read_amounts:!viewer,explanation:'Eventos de cierre en el periodo.',closings:[{assigned_user_id:'owner',won:1,lost:1,conversion_percent:'50.00',currency:viewer?null:'PEN',won_amount:viewer?null:'250.00'}],durations:[{stage_code:'offer',opportunity_count:1,total_hours:'12.00',average_hours:'12.00'}]};
  if(path.endsWith('/assignees'))return [{id:'owner',name:'Propietario'}];
  if(path.endsWith('/stages'))return [{code:'offer',name:'Oferta presentada'}];
  throw Error('Ruta inesperada '+path);
 }
 const quality=async()=>{root.innerHTML=await LuriCustomerQuality.render('company',api,{},permissions,quality);LuriCustomerQuality.mount(root);draws++;},metrics=async()=>{root.innerHTML=await LuriSalesMetrics.render('company',api,{},['contacts.read','crm.opportunities.read'],metrics);LuriSalesMetrics.mount(root);draws++;};
 const test=async(name,fn)=>{await fn();results.push('PASS '+name);out.textContent=results.join('\n');};
 try{
  await test('Calidad escapa HTML y exige revisar identidades',async()=>{await quality();assert(!root.querySelector('img'),'Sin HTML ejecutable');root.querySelector('[data-quality="review"]').click();await wait(()=>root.querySelector('#merge-confirm'));root.querySelector('[data-quality="merge"]').click();await wait(()=>root.textContent.includes('Confirma la revisión'));assert(merges===0,'Sin unión automática');assert(root.textContent.includes('Nota que se conserva'),'Vista previa de notas');});
  await test('Respuesta perdida reintenta sin duplicar la unión',async()=>{root.querySelector('#merge-confirm').checked=true;root.querySelector('[data-quality="merge"]').click();await wait(()=>root.textContent.includes('Respuesta perdida'));root.querySelector('[data-quality="merge"]').click();await wait(()=>root.textContent.includes('Clientes unidos'));assert(merges===1&&calls.filter(c=>c.method==='POST').length===2,'Una sola unión');});
  await test('Sin permisos no consulta calidad ni datos sensibles',async()=>{calls=[];const markup=await LuriCustomerQuality.render('company',api,{},['contacts.read'],quality);assert(markup.includes('No tienes permiso')&&calls.length===0,'Acceso denegado');});
  await test('Cambio de empresa descarta revisión tardía',async()=>{let finish;delayed=new Promise(r=>finish=r);const pending=LuriCustomerQuality.render('old',api,{},permissions,quality);LuriCustomerQuality.reset();finish();assert(await pending==='','Sin empresa anterior');});
  await test('Métricas muestran cierres y horas y envían filtros',async()=>{await metrics();assert(root.textContent.includes('50.00%')&&root.textContent.includes('12.00')&&root.textContent.includes('PEN'),'Métricas');const f=root.querySelector('form');f.elements.from.value='2026-10-01';f.elements.to.value='2026-10-06';f.elements.assigned.value='owner';const before=draws;f.requestSubmit();await wait(()=>draws>before);assert(calls.some(c=>c.path.includes('date_from=')&&c.path.includes('assigned_user_id=owner')),'Filtros en servidor');});
  await test('Viewer consulta métricas sin importe y sin permisos no consulta',async()=>{viewer=true;await metrics();assert(!root.textContent.includes('250.00')&&root.textContent.includes('Restringido'),'Sin importe');calls=[];assert((await LuriSalesMetrics.render('company',api,{},[],metrics)).includes('No tienes permiso')&&calls.length===0,'Sin llamadas no autorizadas');});
  out.textContent+='\n6 pruebas aprobadas.';
 }catch(error){out.textContent+='\nFAIL '+error.message;throw error;}
})();</script></html>
