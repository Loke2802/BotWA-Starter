<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRM móvil: historial y formulario</title>
<link rel="stylesheet" href="../app/portal/portal.css?v=20261007-mobile">
<main class="app-shell">
  <aside class="sidebar"><div class="brand">Luri · Prueba móvil</div><nav aria-label="Secciones">
    <button class="nav-item">Resumen</button><button class="nav-item">Clientes</button><button class="nav-item">Conversaciones</button><button class="nav-item">Seguimientos</button><button class="nav-item">Tablero comercial</button><button class="nav-item">Informe comercial</button>
  </nav></aside>
  <section class="workspace"><header class="topbar"><h1>CRM móvil</h1></header><div class="content">
    <p>Datos ficticios y API simulada. Cambia el ancho y recarga para comprobar el diseño.</p>
    <pre id="results" role="status" style="white-space:pre-wrap;overflow-wrap:anywhere">Ejecutando…</pre><div id="fixture"></div>
  </div></section>
</main>
<script src="../app/portal/opportunity-history.js"></script><script src="../app/portal/opportunities.js"></script>
<script>
(async () => {
  const root = document.querySelector('#fixture'), results = document.querySelector('#results'), report = [];
  const assert = (condition, message) => {if (!condition) throw Error(message);};
  const item = {id:'opportunity', title:'Propuesta' + 'X'.repeat(190), stage_code:'offer', stage_kind:'open', assigned_user_id:'user', amount:'49.50', currency:'PEN', next_action:{description:'Seguimiento' + 'Y'.repeat(190), due_at:'2026-10-08T15:00:00Z'}};
  const c = {root, org:'company', user:{id:'user'}, isCurrent:() => true, commercial:{
    info:{contact_id:'contact', can_write:true, timezone:'America/Lima', channel_type:'whatsapp', account_name:'Cuenta ficticia'},
    customer:{display_name:'Cliente ficticio', classification:'lead'}, items:{items:[item], page:1, total:1, has_next:false}, linked:{items:[item]},
    stages:[{code:'offer', name:'Oferta presentada', kind:'open'}], assignees:[{id:'user', name:'Responsable' + 'Z'.repeat(190)}]
  }, api:async path => {
    const params = new URL(path, location.origin).searchParams, page = Number(params.get('page')), size = Number(params.get('page_size'));
    return Array.from({length:21}, (_, n) => ({version:21-n, actor_user_id:'user', occurred_at:'2026-10-07T15:00:00Z', snapshot:item})).slice((page-1)*size, page*size);
  }};
  const inside = element => {const bounds = element.getBoundingClientRect(); return bounds.left >= -1 && bounds.right <= innerWidth + 1;};
  const fit = () => assert(document.documentElement.scrollWidth <= innerWidth + 1, 'la página desborda el ancho de pantalla');
  async function test(name, run) {await run(); report.push('PASS ' + name); results.textContent = report.join('\n');}
  try {
    root.innerHTML = window.LuriOpportunities.markup(c);
    await test('Tarjetas con título, acción y responsable largos caben en la pantalla', () => {fit(); assert(inside(root.querySelector('.commercial-list')), 'tarjetas recortadas');});
    await window.LuriOpportunities.action(c, 'history', item.id, async () => {});
    await test('Todo el historial y sus botones caben sin desplazamiento horizontal de página', () => {
      fit(); assert(inside(root.querySelector('#commercial-editor')), 'historial recortado');
      root.querySelectorAll('#commercial-editor button').forEach(button => {assert(inside(button), 'control fuera de pantalla'); assert(button.getBoundingClientRect().height >= 44, 'control demasiado pequeño');});
    });
    window.LuriOpportunities.form(c, item);
    await test('Formulario de edición mantiene visibles los campos y las opciones largas', () => {
      fit(); root.querySelectorAll('#commercial-form input, #commercial-form select, #commercial-form textarea').forEach(field => assert(inside(field), 'campo fuera de pantalla: ' + field.name));
      assert(root.querySelector('[name=assigned_user_id]').value === 'user', 'responsable preservado');
      assert(root.querySelector('[name=title]').value === item.title, 'título preservado');
    });
    await test('Se mantiene el desplazamiento propio del menú móvil', () => {
      const nav = document.querySelector('.sidebar nav');
      if (innerWidth <= 880) assert(getComputedStyle(nav).overflowX === 'auto' && inside(nav), 'menú sin contención');
      fit();
    });
    results.textContent = report.join('\n') + '\nCOMPLETE: 4 PASS · ancho ' + innerWidth;
  } catch (error) {results.textContent = report.join('\n') + '\nFAIL ' + error.stack;}
})();
</script></html>
